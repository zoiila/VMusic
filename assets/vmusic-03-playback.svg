<text x="192" y="257" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="63" font-weight="740" letter-spacing="-2.0">A soundtrack for the moment.</text>
<text x="197" y="302" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="25">Different spaces. A considered listening experience.</text>
