<path d="M920 424H1401" stroke="#4B5263" stroke-width="1.5"/>
<text x="921" y="475" fill="#F8F7FC" font-family="Inter,Arial,Helvetica,sans-serif" font-size="31" font-weight="720">Your sound, your level.</text>
<text x="923" y="515" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19">Keep the ambience comfortable.</text>
<text x="923" y="543" fill="#B7C1D0" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19">Join the next track, not the middle.</text>
